<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <meta
      name="description"
      content="VLearn Course Player & AI Tutor Interface"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                red: '#c92a2a',
                redHover: '#b02525',
                darkRed: '#a61e1e',
                primary: '#2563eb'
              },
              neutral: {
                50: '#f9fafb',
                100: '#f3f4f6',
                200: '#e5e7eb',
                300: '#d1d5db',
                400: '#9ca3af',
                500: '#6b7280',
                600: '#4b5563',
                700: '#374151',
                800: '#1f2937',
                900: '#111827'
              }
            },
            fontFamily: {
              sans: ['Inter', '-apple-system', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace']
            },
            fontSize: {
              '2xs': '0.6875rem'
            }
          }
        }
      }
    </script>
    <style>
      ::-webkit-scrollbar {
        width: 5px;
        height: 5px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #d1d5db;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #9ca3af;
      }
      .slide-canvas-bg {
        background: radial-gradient(circle at 50% 30%, #f6f3eb 0%, #ebe5d8 100%);
      }
      .grid-lines-pattern {
        background-image: 
          linear-gradient(to right, rgba(0, 0, 0, 0.04) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(0, 0, 0, 0.04) 1px, transparent 1px);
        background-size: 32px 32px;
      }
    </style>
    <title>VLearn Adaptive Learning Studio</title>
  </head>
  <body class="bg-neutral-100 text-neutral-800 font-sans antialiased h-screen flex flex-col overflow-hidden">
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root" class="h-full flex flex-col"></div>
  </body>
</html>
